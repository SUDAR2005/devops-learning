networks:
  app-network:
    driver: overlay

services:
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - app-network
    deploy:
      replicas: 1

  backend:
    # build: ./backend
    image: three-tier-backend:0.0.1
    networks:
      - app-network
    ports:
      - "8000:8000"
    deploy:
      replicas: 1

  db:
    image: redis:alpine
    networks:
      - app-network
    deploy:
      replicas: 1