sonarqube-scan:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner
        -Dsonar.projectKey=sonarqube-scan
        -Dsonar.projectName="My Project"
        -Dsonar.sources=.
        -Dsonar.host.url=$SONAR_HOST_URL
    - |
      curl --fail --silent --show-error  \
        --user "$SONAR_USER_TOKEN:" \
        "$SONAR_HOST_URL/api/issues/search?projects=sonarqube-scan&ps=500" \
        -o report.json

    - echo "SonarQube report generated:"
    - ls -lh report.json
  artifacts:
    paths:
      - report.json
    expire_in: 1 day
  only:
    - main