.scan_docker_template:
  stage: upload
  image: alpine:3.24
  before_script:
    - apk add --no-cache curl jq
  script:
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0
    - export TRIVY_USERNAME="$CI_REGISTRY_USER"
    - export TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - trivy image --format json --output trivy-results.json $IMAGE_TAG
    - |
      curl -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
        -H "Authorization: Token $DEFECTDOJO_TOKEN" \
        -F "active=true" \
        -F "verified=true" \
        -F "scan_type=Trivy Scan" \
        -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
        -F "file=@trivy-results.json" \
        -F "close_old_findings=true"