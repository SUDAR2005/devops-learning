<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Document</title>
    </head>

    <body>
        <div class="flex flex-col items-center gap-4 p-6">
            <p id="count" class="text-4xl font-bold text-gray-800">0</p>
            <div class="flex gap-3">
                <button id="incBtn" class="px-5 py-2 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 active:scale-95 transition">
                    +
                </button>

                <button id="decBtn" class="px-5 py-2 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 active:scale-95 transition">
                    -
                </button>
            </div>
        </div>
    </body>
    <script>
        const countElement = document.getElementById('count');
        const incBtn = document.getElementById('incBtn');
        const decBtn = document.getElementById('decBtn');

        let count = 0;
        incBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(`/api/inc-count`, {
                    method: 'POST'
                });

                const data = await response.json();
                countElement.textContent = data.count;
            } 
            catch (error) {
                console.error('Error incrementing count:', error);
            }
        });
        
        decBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(`/api/dec-count`, {
                    method: 'POST'
                });

                const data = await response.json();
                countElement.textContent = data.count;
            } 
            
            catch (error) {
                console.error('Error decrementing count:', error);
            }
        });
    </script>
</html>
