apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: default
data:
  rules.yml: |
    groups:
      - name: node_exporter_alerts
        rules:
          - alert: HighCpuUsage
            expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected on {{ $labels.instance }}"
              description: "CPU usage is above 80% for more than 2 minutes."

          - alert: HighMemoryUsage
            expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High Memory usage on {{ $labels.instance }}"
              description: "Memory usage is over 85% for more than 2 minutes."

          - alert: DiskSpaceRunningLow
            expr: ((node_filesystem_size_bytes{fstype=~"ext4|xfs"} - node_filesystem_free_bytes{fstype=~"ext4|xfs"}) / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) * 100 > 85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Disk space low on {{ $labels.instance }}"
              description: "Disk usage on mounted filesystem is above 85%."

          - alert: InstanceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Instance {{ $labels.instance }} down"
              description: "{{ $labels.instance }} of job {{ $labels.job }} has been unreachable for more than 1 minute."